# Sharpa Hand Configuration for Retargeting
# 5 fingers, 22 DOF

optimizer:
  type: "AdaptiveOptimizerAnalytical"

robot:
  type: "sharpa_hand"

retarget:
  huber_delta: 2.0
  huber_delta_dir: 0.5
  norm_delta: 0.04
  w_pos: 5.0
  w_dir: 1.0
  project_tip_dir: false
  w_full_hand: 1.0

  pinch_scaling: 1.0
  alpha: 1.0
  w_contact: 6.0
  segment_scaling:
    thumb: [0.996, 1.049, 1.028]
    index: [1.117, 1.152, 1.156]
    middle: [1.056, 1.067, 1.078]
    ring: [1.072, 1.086, 1.094]
    pinky: [1.119, 1.184, 1.202]

  pinch_thresholds:
    index: {d1: 2.0, d2: 4.0}
    middle: {d1: 2.0, d2: 4.0}
    ring: {d1: 2.0, d2: 4.0}
    pinky: {d1: 2.0, d2: 4.0}

  mediapipe_rotation:
    x: -7.0
    y: 0.0
    z: -20.0

  lp_alpha: 0.4

render:
  camera:
    azimuth: 180
    elevation: -20
    distance: 0.5
