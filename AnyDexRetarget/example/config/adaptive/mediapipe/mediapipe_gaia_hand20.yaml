# Gaia Hand20 Configuration for Retargeting
# Initial Gaia Hand20 simulation profile; scale values inherit the Wuji 20-DOF baseline.
# 5 fingers x 4 joints = 20 DOF

optimizer:
  type: "AdaptiveOptimizerAnalytical"

robot:
  type: "gaia_hand20"

retarget:
  huber_delta: 2.0
  huber_delta_dir: 0.5
  norm_delta: 0.04
  w_pos: 5.0
  w_dir: 1.0
  project_tip_dir: false
  w_full_hand: 1.0

  pinch_scaling: 1.0
  alpha: 1.0
  w_contact: 6.0
  segment_scaling:
    thumb: [0.928, 0.884, 0.944]
    index: [1.552, 1.482, 1.444]
    middle: [1.541, 1.468, 1.437]
    ring: [1.567, 1.504, 1.471]
    pinky: [1.68, 1.699, 1.722]

  pinch_thresholds:
    index: {d1: 2.0, d2: 4.0}
    middle: {d1: 2.0, d2: 4.0}
    ring: {d1: 2.0, d2: 4.0}
    pinky: {d1: 2.0, d2: 4.0}

  mediapipe_rotation:
    x: -5.0
    y: -5.0
    z: -20.0

  lp_alpha: 0.4

render:
  camera:
    azimuth: 180
    elevation: -20
    distance: 0.5
